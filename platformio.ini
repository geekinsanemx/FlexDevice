; PlatformIO project configuration file
;
; FlexDevice — UART/USB slave FLEX paging transmitter (AT commands + binary
; protocol). Sketch lives in flex-fsk-tx-v2.5/, not the repo root, unlike
; flex-fsk-tx — src_dir points there. This is an additive second build
; system alongside the arduino-cli + scripts/flex-build-upload.sh path,
; which remains primary/documented and is unaffected by this file.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = flex-fsk-tx-v2.5

[env]
; Pinned to the pioarduino fork of espressif32, not the official PlatformIO
; Registry espressif32 platform: the official one tops out at arduino-esp32
; core 2.0.17 (ESP-IDF 4.4), which lacks the ESP-IDF 5.x watchdog API
; (esp_task_wdt_config_t, used in src/core/hardware.cpp's watchdog_init())
; that this codebase requires and that arduino-cli's esp32:esp32 core (3.x)
; already provides. pioarduino is the community-standard source for
; arduino-esp32 3.x under PlatformIO.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<bkp/>
    -<build/>
    -<include/tinyflex/demos/>
    -<tinyflex/demos/>
lib_deps =
    jgromes/RadioLib
    olikraus/U8g2
    bblanchon/ArduinoJson
    adafruit/RTClib

[env:ttgo]
board = ttgo-lora32-v21
board_build.partitions = min_spiffs.csv
build_flags = -DTTGO_LORA32_V21

[env:heltec]
board = heltec_wifi_lora_32_V2
build_flags = -DHELTEC_WIFI_LORA32_V2

[env:ttgo-debug]
board = ttgo-lora32-v21
board_build.partitions = min_spiffs.csv
build_flags =
    -DTTGO_LORA32_V21
    -DENABLE_DEBUG

[env:heltec-debug]
board = heltec_wifi_lora_32_V2
build_flags =
    -DHELTEC_WIFI_LORA32_V2
    -DENABLE_DEBUG
